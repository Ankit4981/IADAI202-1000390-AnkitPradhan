<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>LogiSight Analytics – Interactive Storyboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
/* palette */--primary:#0F766E;--pd:#115E59;--pl:#E3F2EF;--ps:#F0F8F6;--hd:#0F766E;--bar:#0F6B64;--navy:#1B2A4A;--cn:#CBD5D1;

/* depth */--sh1:0 4px 6px -1px rgba(0,0,0,.05),0 2px 4px -1px rgba(0,0,0,.03);--sh2:0 12px 28px -10px rgba(15,118,110,.35)}
[data-theme=dark]{--sh1:0 1px 2px rgba(0,0,0,.4);--sh2:0 12px 28px -10px rgba(0,0,0,.6);--bg:#101B1A;--sf:#172624;--sf2:#20332F;--tp:#F3F7F6;--ts:#C1D0CC;--tm:#A1B3AE;--bd:#344B45;--bds:#4A6962;--primary:#5CC7B8;--pl:#234B44;--ps:#1B332F;--nb:#3D321F;--nt:#FFE2A8;--nbd:#6B5630;--hd:#5CC7B8;--pd:#BFEDE5;--navy:#E6EEF0;--cn:#4A5F5A;--bar:#0b3f3a}
*{box-sizing:border-box}html{scroll-behavior:smooth;scroll-snap-type:y proximity}body{margin:0;font:400 14px/1.6 var(--font);background:var(--bg);color:var(--tp)}
h1,h2,h3,p{margin:0}:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
#prog{position:fixed;top:0;left:0;height:3px;background:var(--primary);width:0;z-index:50}
.ctl{position:fixed;top:10px;right:12px;z-index:40;display:flex;gap:8px}
.btn{font:600 13px var(--font);padding:9px 14px;min-height:40px;border-radius:8px;border:1px solid var(--bds);background:var(--sf);color:var(--tp);cursor:pointer;transition:.3s}.btn:hover{border-color:var(--primary)}.btn.pri{background:var(--primary);color:#fff;border-color:var(--primary)}[data-theme=dark] .btn.pri{color:#0b1d1b}

.ft{background:var(--bar);color:#fff;font-size:12px;font-weight:600;padding:12px 24px;display:flex;flex-wrap:wrap;gap:6px 22px}.ft span+span{border-left:1px solid rgba(255,255,255,.4);padding-left:22px}

.sub{font-size:18px;font-weight:600;color:var(--navy);max-width:34ch}.sm{color:var(--ts);font-size:14px;max-width:48ch}
.panel{background:var(--ps);border:1px solid var(--bd);border-radius:12px;padding:18px}

.rl{opacity:0;transform:translateX(-24px);transition:.7s var(--d,0s)}.in .rl{opacity:1;transform:none}
.dl{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;margin-top:16px}.dl dt{color:var(--hd);font-weight:700}.dl dd{margin:0;font-weight:600;color:var(--navy)}
.g{display:grid;gap:12px}.k3{grid-template-columns:repeat(3,1fr)}
.kpi{background:var(--sf);border:1px solid var(--bds);border-radius:12px;padding:14px;text-align:center}.kpi small{font-size:12px;font-weight:700;color:var(--navy)}.kpi b{display:block;font-size:34px;color:var(--hd);line-height:1.3}.kpi span{font-size:11px;color:var(--ts)}
.sk{border:1.5px dashed var(--bds);border-radius:8px;padding:6px 10px;font-size:11px;font-weight:600;font-style:italic;color:var(--nt);background:var(--nb);text-align:center;margin-top:10px}
.ph{height:150px;display:flex;align-items:center;justify-content:center;border:1.5px dashed var(--bds);border-radius:8px;background:var(--sf);margin-top:10px}
.flt{display:flex;gap:12px;align-items:stretch}.flt .panel{flex:1.1}.mid{flex:.6;background:var(--bar);color:#fff;border-radius:12px;display:flex;align-items:center;text-align:center;padding:14px;font-weight:700}
.fa{display:flex;align-items:center;color:var(--primary);font-size:26px;font-weight:700}.fa svg{width:34px}.fa path{stroke-dasharray:40;stroke-dashoffset:40;transition:stroke-dashoffset .8s 1s}.in .fa path{stroke-dashoffset:0}
label{display:block;font-size:12px;font-weight:700;color:var(--navy);margin:8px 0 3px}select{width:100%;padding:7px 9px;border:1px solid var(--bds);border-radius:8px;background:var(--sf);color:var(--tp);font:13px var(--font)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;min-height:24px}.chip{background:var(--pl);color:var(--pd);font-size:11px;padding:2px 9px;border-radius:99px;border:1px solid var(--bds)}
.note{background:var(--nb);color:var(--nt);border:1px solid var(--nbd);border-radius:8px;padding:8px 10px;font-size:12px;line-height:1.5;margin-top:10px}
.heat{display:grid;grid-template-columns:70px repeat(4,1fr);gap:4px;font-size:12px;font-weight:700;color:var(--navy)}.heat .c{height:38px;background:var(--cn);opacity:.55;border-radius:3px;transform:scale(.6);transition:.5s var(--d)}.in .heat .c{transform:none}.heat .h{text-align:center;align-self:end}.heat .r{align-self:center;text-align:right;padding-right:6px}
.vt{display:grid;grid-template-columns:90px repeat(4,1fr);gap:4px;font-size:12px;font-weight:700;color:var(--hd)}.vt .c{height:34px;background:var(--cn);opacity:.55;border-radius:3px}.vt .bars{display:none}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}.panel h3{font-size:14px;color:var(--navy);margin-bottom:6px}
.pt{fill:var(--cn);transform:scale(0);transform-box:fill-box;transform-origin:center;transition:transform .4s var(--d)}.in .pt{transform:none}
svg text{fill:var(--ts);font:11px var(--font)}.ax{stroke:var(--bds)}
.ring{fill:none;stroke:var(--primary);stroke-width:1.5;stroke-dasharray:6 5;opacity:.7}.spoke{stroke:var(--primary);stroke-width:2;stroke-dasharray:200;stroke-dashoffset:200;transition:stroke-dashoffset 1.2s var(--d)}.in .spoke{stroke-dashoffset:0}
.big{font-size:30px;font-weight:700;color:var(--hd)}.fact{border-bottom:1px solid var(--bd);padding:8px 0;font-weight:600;color:var(--navy)}
.cb{display:grid;grid-template-columns:78px 1fr;gap:3px 8px;font-size:10px;align-items:center}.cb .bar{height:9px;border-radius:2px;background:var(--cn);width:0;transition:width .7s var(--d)}.in .cb .bar{width:75%}.cb span{text-align:right;color:var(--ts)}
.tl{display:flex;align-items:flex-start;gap:6px;margin:24px 0 16px}.st{text-align:center;flex:1;opacity:.55;transition:.5s}.st .dot{width:64px;height:64px;border-radius:50%;margin:0 auto 8px;border:2px solid var(--bds);background:var(--sf);display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:700;color:var(--hd);transition:.5s}.st b{font-size:13px;color:var(--navy)}.st p{font-size:12px;color:var(--ts)}
.st.act{opacity:1;transform:translateY(-4px)}.st.act .dot{border-color:var(--primary);box-shadow:0 0 0 4px var(--pl)}.st.done{opacity:1}.st.done .dot{background:var(--primary);color:#fff;border-color:var(--primary)}
.cd{background:var(--sf);border:1px solid var(--bd);border-radius:12px;padding:14px}.cd:hover{border-color:var(--primary)}.cd h3{font-size:14px;color:var(--hd)}.cd p{font-size:12px;color:var(--ts)}pre{margin:8px 0;padding:10px;background:var(--sf2);border:1px solid var(--bd);border-radius:8px;overflow-x:auto;font:12px/1.5 var(--mono);color:var(--tp)}.kw{color:#0F766E;font-weight:700}.s{color:#9A3412}[data-theme=dark] .kw{color:#5CC7B8}[data-theme=dark] .s{color:#F4B183}
.wide{grid-template-columns:1fr!important}.flow{display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:start}.col{display:flex;flex-direction:column;align-items:center}
.node{width:100%;background:var(--sf);border:1.5px solid var(--bds);border-radius:8px;padding:8px 12px;opacity:0;transform:translateY(8px);transition:.4s}.node.show{opacity:1;transform:none}.node b{font-size:12px;color:var(--hd)}.node ul{margin:3px 0 0;padding-left:16px;font-size:11px;color:var(--ts)}.node.hl{background:var(--primary)}.node.hl b{color:#fff}
.arr{width:2px;height:18px;position:relative}.arr i{position:absolute;inset:0 auto auto 0;width:2px;height:0;background:var(--primary);transition:height .3s}.arr.d i{height:100%}.arr:after{content:"";position:absolute;left:-4px;bottom:-1px;border:5px solid transparent;border-top:7px solid var(--primary);border-bottom:0;opacity:0;transition:.2s .25s}.arr.d:after{opacity:1}
.br{border:1.5px dashed var(--bds);border-radius:12px;padding:12px;display:flex;flex-direction:column;align-items:center}.br>p{font-size:11px;color:var(--ts);margin-bottom:8px}
.van{transform:translateX(-120px);opacity:0;transition:transform 1.6s cubic-bezier(.2,.7,.2,1) .4s,opacity .6s .4s}.in .van{transform:none;opacity:1}.rd{stroke-dasharray:14 12;animation:rd 1.2s linear 3}@keyframes rd{to{stroke-dashoffset:-26}}

/* ===== POLISH: type, depth, logos ===== */
body{-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
h1.t,h2.t{letter-spacing:-.025em}
.panel,.kpi,.cd,.node,.note,select{box-shadow:var(--sh1)}
.btn{box-shadow:var(--sh1)}.kpi,.cd{transition:box-shadow .3s,border-color .3s}.kpi:hover,.cd:hover{box-shadow:var(--sh2);border-color:var(--primary)}
.tb{background:linear-gradient(100deg,var(--bar) 0 38%,#14877e 50%,var(--bar) 62% 100%);background-size:260% 100%;animation:shine 7s linear infinite}
@keyframes shine{to{background-position:-260% 0}}
.lg{gap:16px}.lg .badge{display:flex;align-items:center;background:#fff;border:1px solid var(--bd);border-radius:10px;padding:5px 12px;box-shadow:var(--sh1)}.lg img{height:42px;width:auto;display:block}
.lg .badge+i+.badge img{height:46px}
/* ===== SCROLL MOTION ===== */
.slide{position:relative;isolation:isolate}.slide>*{position:relative;z-index:1}.slide>.orb{position:absolute;z-index:0}
.orb{border-radius:50%;filter:blur(48px);opacity:.85;pointer-events:none;will-change:transform}
.o1{width:360px;height:360px;top:-90px;right:-70px;background:var(--pl);transform:translate3d(0,calc(var(--p,0)*-90px),0)}
.o2{width:280px;height:280px;bottom:30px;left:-90px;background:var(--ps);transform:translate3d(0,calc(var(--p,0)*70px),0)}
.bd>div:last-child{transform:translate3d(0,calc(var(--p,0)*-18px),0);will-change:transform}
.bd>div:first-child{transform:translate3d(0,calc(var(--p,0)*10px),0)}
#prog{overflow:visible}#prog svg{position:absolute;right:-20px;top:3px;width:40px;filter:drop-shadow(0 1px 2px rgba(0,0,0,.25))}
/* ===== DELIVERY VAN SCENE ===== */
.scene{border-radius:12px;border:1px solid var(--bd);box-shadow:var(--sh1);display:block}
.sl{animation:scr var(--t,12s) linear infinite}@keyframes scr{to{transform:translateX(-460px)}}
.rd{stroke-dasharray:28 24;animation:rd .55s linear infinite}@keyframes rd{from{stroke-dashoffset:0}to{stroke-dashoffset:52}}
.bob{transform-box:fill-box;transform-origin:50% 100%;animation:bob .45s ease-in-out infinite alternate}@keyframes bob{to{transform:translateY(-2.5px) rotate(-.35deg)}}
.wh{transform-box:fill-box;transform-origin:center;animation:spin .5s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.puff{opacity:0;transform-box:fill-box;transform-origin:center;animation:puff 1.4s ease-out infinite;animation-delay:var(--d,0s)}
@keyframes puff{0%{opacity:.6;transform:translate(0,0) scale(.5)}100%{opacity:0;transform:translate(-46px,-14px) scale(1.8)}}
.streak{stroke:var(--primary);stroke-width:3;stroke-linecap:round;opacity:0;animation:streak .9s linear infinite;animation-delay:var(--d,0s)}
@keyframes streak{0%{opacity:0;transform:translateX(26px)}30%{opacity:.55}100%{opacity:0;transform:translateX(-30px)}}
.beam{animation:beam 1.6s ease-in-out infinite alternate}@keyframes beam{from{opacity:.2}to{opacity:.55}}
/* ===== CHARTS ===== */
.pt.dot{fill:var(--primary);opacity:.85;transition:transform .4s var(--d),cx .7s ease,cy .7s ease}.pt.dot:hover,.pt.dot:focus-visible{opacity:1;stroke:var(--sf);stroke-width:2}
.tline{fill:none;stroke:var(--primary);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:1;transition:stroke-dashoffset 1.6s .5s ease}.in .tline{stroke-dashoffset:0}
.tarea{opacity:0;transition:opacity 1s 1.3s}.in .tarea{opacity:1}
.trend{stroke:var(--primary);stroke-width:2;stroke-dasharray:6 4;opacity:0;transition:opacity .6s 1.6s}.in .trend{opacity:.9}
.seg{display:flex;gap:6px;margin-bottom:6px}.seg .btn{min-height:30px;padding:4px 10px;font-size:12px}.seg .btn.on{background:var(--primary);color:#fff;border-color:var(--primary)}[data-theme=dark] .seg .btn.on{color:#0b1d1b}
.heat .c{opacity:1;display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--tp);background:color-mix(in srgb,var(--primary) var(--a,40%),var(--sf));cursor:default}
.heat .c.hi{color:#fff}[data-theme=dark] .heat .c.hi{color:#0b1d1b}
.in .heat .c:hover,.in .heat .c:focus-visible{transform:scale(1.1);transition-delay:0s;box-shadow:var(--sh2);position:relative;z-index:2}
.leg{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--ts);margin-top:8px}.leg i{flex:0 0 120px;height:8px;border-radius:99px;background:linear-gradient(90deg,color-mix(in srgb,var(--primary) 18%,var(--sf)),var(--primary))}
.vt .c{opacity:1;position:relative;overflow:hidden;background:var(--sf2);cursor:default}
.vt .c i{position:absolute;inset:0 auto 0 0;width:0;background:linear-gradient(90deg,var(--pl),var(--primary));opacity:.8;transition:width .9s cubic-bezier(.2,.7,.2,1) var(--d)}.in .vt .c i{width:var(--w)}
.vt .c span{position:relative;font-size:11px;font-weight:700;padding-left:7px;line-height:34px;color:var(--tp)}
.vt .c.few{outline:1.5px dashed var(--nbd);outline-offset:-1px}
.cb{row-gap:5px}.cb .bar{height:11px;border-radius:99px;background:linear-gradient(90deg,var(--pl),var(--primary))}.in .cb .bar{width:var(--w)}.cb .bar:hover,.cb .bar:focus-visible{filter:brightness(1.15)}
.orb2{transform-origin:150px 130px;animation:orbit 6s linear infinite}.orb3{transform-origin:150px 130px;animation:orbit 11s linear infinite reverse}@keyframes orbit{to{transform:rotate(360deg)}}
.btn.dirty{animation:nudge 1.3s ease-in-out infinite}@keyframes nudge{50%{box-shadow:0 0 0 5px var(--pl)}}
/* ===== TOOLTIP ===== */
#tip{position:fixed;z-index:60;pointer-events:none;background:#10201e;color:#fff;border:1px solid rgba(255,255,255,.14);border-radius:8px;padding:7px 10px;font-size:12px;line-height:1.45;max-width:240px;box-shadow:0 8px 24px -6px rgba(0,0,0,.4);opacity:0;transform:translateY(4px);transition:opacity .15s,transform .15s}
#tip.on{opacity:1;transform:none}#tip b{display:block}#tip span{display:block;color:#bcd3ce}

@media(max-width:900px){.bd{grid-template-columns:1fr;padding:16px 20px;gap:20px}h2.t{font-size:32px}h1.t{font-size:36px}.flt,.tl{flex-direction:column}.fa{transform:rotate(90deg);justify-content:center}.k3,.two,.flow{grid-template-columns:1fr}#dots{display:none}.ctl{position:static;padding:8px 12px;justify-content:flex-end;background:var(--sf)}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}html{scroll-behavior:auto}.rv,.rl,.van,.node,.orb,.bd>div,.bd>div:last-child{opacity:1!important;transform:none!important}.ln,.heat .c,.pt{transform:none!important}.cb .bar{width:var(--w)!important}.spoke,.fa path{stroke-dashoffset:0!important}.arr i{height:100%!important}.arr:after{opacity:1!important}}
@page{size:A4 landscape;margin:12mm}
@media print{.ctl,#dots,#prog,.noprint,.orb,#tip{display:none!important}html{scroll-snap-type:none}body{background:#fff!important;print-color-adjust:exact;-webkit-print-color-adjust:exact}:root,[data-theme=dark]{--bg:#fff;--sf:#fff;--sf2:#F1F7F5;--tp:#172B2A;--ts:#526664;--bd:#D8E5E1;--bds:#B8CEC8;--primary:#0F766E;--pl:#E3F2EF;--ps:#F0F8F6;--hd:#0F766E;--pd:#115E59;--navy:#1B2A4A;--cn:#CBD5D1;--bar:#0F6B64;--nb:#FFF7E6;--nt:#7A4A00;--nbd:#F2D7A6}*{transition:none!important;animation:none!important}.rv,.rl,.van,.node,.orb,.bd>div,.bd>div:last-child{opacity:1!important;transform:none!important}.ln,.heat .c,.pt{transform:none!important}.cb .bar{width:var(--w)!important}.spoke,.fa path{stroke-dashoffset:0!important}.arr i{height:100%!important}.arr:after{opacity:1!important}.slide{min-height:0;height:182mm;break-before:page;page-break-before:always;break-inside:avoid;border:0}.slide:first-of-type{break-before:auto;page-break-before:auto}.bd{padding:6mm 10mm;gap:16px}h2.t{font-size:30px}h1.t{font-size:34px}.kpi b{font-size:26px}.ph{height:100px}}
